{{define "bill-extraction.html"}}<div class="extraction"><strong>Bill read — please confirm the values</strong><p>{{if .Extraction.Utility}}Utility: {{.Extraction.Utility}} · {{end}}{{if .Extraction.TariffCategory}}Category: {{.Extraction.TariffCategory}}{{end}}</p></div><input id="bill-amount" name="bill" type="number" min="0" value="{{.Extraction.Amount}}" required hx-swap-oob="outerHTML:#bill-amount"><input id="bill-units" name="units" type="number" min="0" value="{{.Extraction.UnitsKWh}}" hx-swap-oob="outerHTML:#bill-units"><input id="bill-load" name="sanctioned_load" type="number" min="0" step=".1" value="{{.Extraction.SanctionedLoadKW}}" hx-swap-oob="outerHTML:#bill-load">{{end}}
